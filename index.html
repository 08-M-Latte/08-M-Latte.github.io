<!doctype html>
<html lang="jp">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ニャニャニャ〜</title>
        <meta name="description" content="Content Info" />
        <link rel="icon" href="./favicon.ico" />

        <script>
            // キャッシュは通常どおり使い、更新があれば自動で反映する
            // 初回読み込み時に ETag / Last-Modified を基準として記録し、それ以降は条件付きリクエストで軽く確認する
            (function () {
                var STORAGE_KEY = "page-version";

                function getStored() {
                    try {
                        return localStorage.getItem(STORAGE_KEY);
                    } catch (e) {
                        return null;
                    }
                }

                function setStored(value) {
                    try {
                        localStorage.setItem(STORAGE_KEY, value);
                    } catch (e) {
                        /* ストレージが利用できない例外は無視 */
                    }
                }

                function checkForUpdate() {
                    fetch(location.href, { cache: "no-cache" })
                        .then(function (res) {
                            var tag = res.headers.get("etag") || res.headers.get("last-modified");
                            if (!tag) {
                                return;
                            }
                            var prev = getStored();
                            if (prev === null) {
                                // 初回は基準値を記録するだけ
                                setStored(tag);
                            } else if (prev !== tag) {
                                // 更新があれば記録してから再読み込み（reload は条件付きリクエストになる）
                                setStored(tag);
                                location.reload();
                            }
                        })
                        .catch(function () {
                            /* オフライン時などは無視 */
                        });
                }

                window.addEventListener("load", function () {
                    setTimeout(checkForUpdate, 2000);
                });

                // タブ復帰時にも確認する
                document.addEventListener("visibilitychange", function () {
                    if (!document.hidden) {
                        checkForUpdate();
                    }
                });

                // 定期的にも確認する
                setInterval(checkForUpdate, 60000);
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />

        <link rel="stylesheet" href="./assets/styles/loaders.css" />
        <iframe id="global-loader-iframe" src="./loaders/global.html"></iframe>

        <link rel="stylesheet" href="./assets/vendor/font-awesome.min.css" />

        <script src="./assets/vendor/alpinejs.min.js" defer></script>
        <script src="./assets/vendor/sweetalert2.min.js"></script>
        <script src="./assets/vendor/typed.umd.js"></script>
        <script src="./assets/vendor/markdown-it.min.js"></script>

        <link rel="stylesheet" href="./assets/styles/elements.css" />
        <link rel="stylesheet" href="./assets/styles/index.css" />
        <link rel="stylesheet" href="./assets/styles/responsive/index.css" />

        <script src="./assets/scripts/utils.js"></script>
        <script src="./assets/scripts/theme-loader.js"></script>
        <script src="./assets/scripts/index.js"></script>

        <theme></theme>
    </head>
    <body x-data="">
        <div class="page-head">
            <span class="title"></span>
        </div>

        <div class="primary-container">
            <div class="left-area">
                <div class="cards">
                    <div class="card-item" id="personal-info">
                        <img class="avatar" :src="config.content.masterInfo.avatar" />
                        <span class="name" x-text="config.content.masterInfo.name">Loading...</span>
                        <div class="social-icons">Loading...</div>
                    </div>
                    <div class="card-item" id="recommend">
                        <span class="title"><i class="fa-solid fa-bullhorn"></i>お知らせ</span>
                        <div class="content">
                            <div class="markdown-content" src="./assets/markdown/announcement.md"></div>
                        </div>
                    </div>
                    <div class="card-item" id="hitokoto">
                        <span class="title"><i class="fa-solid fa-scroll"></i>名言</span>
                        <div class="content">
                            <a href="https://www.nintendo.co.jp/jobs/human-capital/index.html" target="_blank">独創性　柔軟性　誠実さ</a>
                        </div>
                    </div>
                    <div class="card-item" id="settings">
                        <span class="title"><i class="fa-solid fa-sliders"></i>表示設定</span>
                        <div class="content">
                            <div class="settings-item theme-settings">
                                <span class="title"><i class="fa-solid fa-shirt"></i>カラーテーマ · <span x-text="config.content.theme.displayName"></span></span>
                                <div class="themes"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="right-area">
                <div class="content-page">
                    <div class="markdown-content" src="./assets/markdown/content-page.md"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span class="icp-info">Loading...</span>
            <span class="line-break"><i class="fa-solid fa-ellipsis"></i></span>
            <!-- ここは触らないでね…（＞﹏＜） -->
            <!-- 「[Loading...]」の実際の内容は config.json の masterInfo.info 項目で変更できますよ〜 -->
            <span
                >当サイトは <span class="webmaster-info"><a :href="config.content.masterInfo.website" target="_blank" x-text="config.content.masterInfo.name">[Loading...]</a> の手によって <i class="fa-solid fa-heart"></i> を込めて制作されています</span
            >

            <span>Powered by <a href="https://github.com/ChengCheng0v0/ACG-Home" target="_blank">ACG-Home</a></span>
        </div>

        <iframe id="theme-color-loader-iframe" src="./loaders/theme-color.html"></iframe>

        <script>
            // スクロールバーを非表示
            document.body.style.overflow = "hidden";

            // ローディングアニメーションの最短表示時間
            const minimumLoadingTime = 1800;
            const startTime = new Date().getTime();

            // ページ読み込み完了後に、最短表示時間を満たしているかどうかを計算
            window.addEventListener("load", function () {
                const currentTime = new Date().getTime();
                const elapsedTime = currentTime - startTime;

                // ページの読み込み時間が最短表示時間未満なら、ローディングアニメーションの非表示を遅延
                const delay = Math.max(0, minimumLoadingTime - elapsedTime);
                setTimeout(() => {
                    // document.querySelector(".content").style.display = "block"; // サイトの内容を表示
                    document.getElementById("global-loader-iframe").className = "end"; // 終了アニメーションを再生
                    document.body.style.overflow = "unset"; // スクロールバーを再表示
                }, delay);
            });
        </script>
    </body>
</html>
